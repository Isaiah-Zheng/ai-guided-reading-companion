<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Reader</title><link rel="stylesheet" href="reader.css"></head>
<body>
<header class="toolbar"><strong>AI Reader</strong><div class="actions"><button id="original" aria-pressed="false">Original</button><button id="enhanced" aria-pressed="true">Enhanced</button><button id="settings-toggle" aria-expanded="false">Settings</button></div></header>
<main class="page">
<section id="settings" hidden><label>Text size <input id="font-size" type="range" min="16" max="26" value="20"></label><label>Language <select id="language"><option value="both">English + 中文</option><option value="zh">中文</option><option value="en">English</option></select></label><p>AI annotation is experimental; original text is always available.</p></section>
<p id="status" role="status" aria-live="polite">Opening article…</p>
<article id="article"><h1 id="title"></h1><p id="source"></p><div id="content"></div></article>
<aside id="detail" hidden><button id="close-detail" aria-label="Close explanation">×</button><div id="detail-content"></div></aside>
</main><script src="reader.js"></script>
</body></html>
