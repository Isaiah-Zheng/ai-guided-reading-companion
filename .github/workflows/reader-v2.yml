name: Reader v2 tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/reader-v2]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/extension.test.cjs tests/reader-v2.test.cjs
      - run: node --check extension/background.js
      - run: node --check extension/reader.js
      - run: node --check extension/sidepanel.js
